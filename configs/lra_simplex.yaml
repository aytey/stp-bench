# The linear-arithmetic theory propagator under the three SAT backends STP
# can host it on, against each other: one binary, one flag per column.
#
#   ./run_comparison.py configs/lra_simplex.yaml
#
# The solve is the same in every column -- the double-precision simplex
# driving the partial checks through the backend's IPASIR-UP interface, every
# conflict and model re-derived by the exact engine, lemmas on demand -- so
# the answers are meant to be identical and only the time should move. A
# sat/unsat split between columns is therefore a bug, not a result; the runner
# reports those separately, in <output>_answer_disagreements.csv. CaDiCaL is
# the baseline because it is the backend every number in BENCHMARK_STATUS.md
# was measured on.
#
# This replaces the earlier two-column comparison of the exact and float
# simplex implementations, which the float driver's promotion has settled:
# `--lra-float-driver=0` still selects the exact engine as the driver, and a
# column with it can be added back beside these if that comparison is wanted
# again.
name: LRA propagator under three SAT backends (new_simplex)
output_prefix: lra_simplex

benchmarks:
  dirs:
    # Non-incremental only, deliberately. STP's incremental driver hands every
    # Real query to the batch coordinator, so the 3,068 files under
    # lra_bench/incremental would measure the batch path over again rather
    # than anything incremental. This is 3,037 files: QF_LRA 1,753 and
    # QF_UFLRA 1,284.
    - /mnt/baranem/lra_bench/non-incremental

run:
  # The budget BENCHMARK_STATUS.md measures this branch at, so the numbers
  # here can be read beside the ones there. Everything else -- repeats,
  # revalidation policy -- comes from configs/defaults.yaml.
  timeout: 20.0

report:
  # A 24s cutoff would be inert against a 20s timeout, so score at half the
  # budget and at all of it.
  virtual_timeouts: [10, 20]

binaries:
  # A build with all three backends compiled in, from the worktree so the
  # results are named by its commit. The recipe (BENCHMARK_STATUS.md, "The
  # propagator under three backends"): CryptoMiniSat built shared into a
  # prefix of its own so STP's CaDiCaL stays the 3.0.1 it pins --
  #
  #   cd /home/avj/clones/stp-lra/new_simplex
  #   ./scripts/deps/setup-cms.sh -DBUILD_SHARED_LIBS=ON \
  #       -DCMAKE_INSTALL_PREFIX=$PWD/deps/cms-install
  #   cmake -S . -B build-up -G Ninja -DCMAKE_BUILD_TYPE=Release \
  #       -DENABLE_AUTO_DOWNLOAD=ON -DUSE_CADICAL=ON -DUSE_MINISAT=ON \
  #       -DUSE_CRYPTOMINISAT=ON \
  #       -Dcryptominisat5_DIR=$PWD/deps/cms-install/lib/cmake/cryptominisat5 \
  #       -Dcadical_DIR=$PWD/deps/cms-install/lib64/cmake/cadical \
  #       -Dcadiback_DIR=$PWD/deps/cms-install/lib64/cmake/cadiback
  #   cmake --build build-up -j
  #
  # A build-tree binary carries the CryptoMiniSat prefix in its RUNPATH, so
  # no loader path is needed. `stp --version` should say
  # "cadical 3.0.1, cryptominisat 5.14.7, minisat"; a build whose CaDiCaL
  # reads 2.1.3 fell back to the one CryptoMiniSat bundles. A machine that
  # builds it elsewhere pins its own path in configs/local.yaml rather than
  # editing this file.
  stp: /home/avj/clones/stp-lra/new_simplex/build-up/stp

arg_groups:
  common:
    # SMT-LIB2 is already what the parser falls back to with no format flag,
    # but this run should not change meaning if that default moves.
    - --SMTLIB2
    # Both are on by default today. Pinned so that the comparison cannot
    # silently become one of lazy loops if either default flips: the theory
    # propagator is what these columns are about, and the float driver is
    # what drives it.
    - --lra-theory-propagation=1
    - --lra-float-driver=1
    # Not --threads=1: it excludes every backend flag but --cryptominisat, so
    # naming it here would fail two of the three columns. One thread is the
    # default, and CryptoMiniSat hosts a propagator single-threaded only; a
    # thread count above one would silently turn the propagator off there.

# The backend flags are CLI11 flags and take no value. They exclude each
# other, so each column names exactly one.
solvers:
  - name: cadical
    binary: stp
    arg_groups: [common]
    args: [--cadical]

  - name: cryptominisat
    binary: stp
    arg_groups: [common]
    args: [--cryptominisat]

  - name: minisat
    binary: stp
    arg_groups: [common]
    args: [--minisat]
