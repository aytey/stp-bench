# The equality abstraction's constant-side policy: an equality one side of
# which the blast knows entirely is left to its comparator
# (--bv-eq-abstraction-constant-side, off = exact) -- measured against the
# previous behaviour, with the FP and BV term constant-operand policies at
# their defaults on both arms. Built on the converted flux-balance QF_FP
# queries at binary128, where the equality records alone turned a
# nine-second proof into a timeout; this checks KLEE.
name: equality abstraction, constant side (exact vs record)
output_prefix: fp_abs_eqconst

benchmarks:
  dirs:
    - /home/avj/fp-abs-results/v3/bench-v3/queries

run:
  timeout: 60.0
  runs: 1
  workers: 24

revalidation:
  enabled: false

binaries:
  stp: /home/avj/clones/stp/fp_cegar/build-rel-exp/stp

arg_groups:
  base: [--cadical, --bv-eq-abstraction=1, --bv-term-abstraction=1, --fp-abstraction=1]

solvers:
  - name: eq-exact
    binary: stp
    arg_groups: [base]
  - name: eq-abs
    binary: stp
    arg_groups: [base]
    args: [--bv-eq-abstraction-constant-side=1]
  - name: bv64-eq-exact
    binary: stp
    args: [--cadical, --bv-eq-abstraction=1, --bv-term-abstraction=1]
  - name: bv64-eq-abs
    binary: stp
    args: [--cadical, --bv-eq-abstraction=1, --bv-term-abstraction=1, --bv-eq-abstraction-constant-side=1]
