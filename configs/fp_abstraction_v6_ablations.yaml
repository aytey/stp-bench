# The ablation set, at both trail-reuse settings.
#
#   ./run_comparison.py configs/fp_abstraction_v6_ablations.yaml
#
# Each arm disables one part of the floating-point layer against the same
# baseline, so the table says which parts carry the result. Every arm is run
# at both --refinement-trail-reuse settings, for two reasons.
#
# The first is correctness rather than thoroughness: the ablation's own
# baseline arm has to be the same configuration as the main table's
# floating-point arm, or the two tables do not compose. Inheriting the flag's
# default, which is what the previous ablation config did, made them differ.
#
# The second is that the flag is known to move the two float widths in
# opposite directions, so whether a given part of the layer is load-bearing
# could in principle depend on it. Running both settings costs about two and a
# half hours against the main pass's twenty, which is cheap for the answer.
#
# Unsuffixed names are trail off; the -trail suffix is the same arm with the
# trail kept. Every arm passes the flag explicitly, so nothing here inherits a
# default that a later upstream change could reinterpret.

name: FP abstraction ablations, both trail settings
output_prefix: fp_abs_v6_ablate

benchmarks:
  dirs:
    - /mnt/baranem/fp-benchmarks/bench-v3/queries

run:
  timeout: 120.0
  runs: 1
  workers: 18

revalidation:
  enabled: false

binaries:
  stp: /home/avj/clones/stp/campaign-builds/fp-cegar-dc22dd12/build/stp

arg_groups:
  base: [--cadical, --bv-eq-abstraction=1, --bv-term-abstraction=1, --fp-abstraction=1]
  trailoff: [--refinement-trail-reuse=0]
  trailon: [--refinement-trail-reuse=1]

solvers:
  - name: fp-bv64
    binary: stp
    arg_groups: [base, trailoff]
  - name: tiers-0
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-tiers=0]
  - name: tiers-1
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-tiers=1]
  - name: tiers-2
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-tiers=2]
  - name: no-bands
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-significand-bits=0, --fp-abstraction-significand-bits-wide=0]
  - name: no-relational
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-relational=0]
  - name: no-values
    binary: stp
    arg_groups: [base, trailoff]
    args: [--fp-abstraction-values=0]
  - name: fp-bv64-trail
    binary: stp
    arg_groups: [base, trailon]
  - name: tiers-0-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-tiers=0]
  - name: tiers-1-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-tiers=1]
  - name: tiers-2-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-tiers=2]
  - name: no-bands-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-significand-bits=0, --fp-abstraction-significand-bits-wide=0]
  - name: no-relational-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-relational=0]
  - name: no-values-trail
    binary: stp
    arg_groups: [base, trailon]
    args: [--fp-abstraction-values=0]
